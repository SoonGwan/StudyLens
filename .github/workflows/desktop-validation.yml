name: Desktop validation

on:
  pull_request:
  push:
    branches: [main, 'ci/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.3'
      - name: Select current stable Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustc -vV
      - name: Install locked frontend dependencies
        run: bun install --frozen-lockfile
      - name: TypeScript and frontend tests
        run: |
          bun run typecheck
          bunx vitest run
      - name: Build platform helper
        run: bun run build:helper
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Swift tests and helper protocol
        if: runner.os == 'macOS'
        run: |
          swift test --package-path native
          bun run test:helper
      - name: Build macOS app and DMG
        if: runner.os == 'macOS'
        run: bunx tauri build --ci --bundles app,dmg
      - name: Verify macOS bundles
        if: runner.os == 'macOS'
        run: |
          codesign --verify --deep --strict --verbose=2 src-tauri/target/release/bundle/macos/StudyLens.app
          for image in src-tauri/target/release/bundle/dmg/*.dmg; do
            hdiutil verify "$image"
          done
      - name: Build Windows NSIS installer
        if: runner.os == 'Windows'
        run: bunx tauri build --ci --bundles nsis
      - name: Upload validation installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: studylens-validation-${{ matrix.os }}-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
